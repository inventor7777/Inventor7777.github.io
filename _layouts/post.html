---
layout: default
---
<article class="post">
  <header class="page-heading"><h1>{{ page.title | escape }}</h1><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></header>
  <div class="prose">{{ content }}</div>
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← All posts</a>
</article>
