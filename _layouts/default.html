<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/donut.png' | relative_url }}" alt="" width="40" height="40">inventor7777</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/projects/' | relative_url }}" {% if page.section == 'projects' %}aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.section == 'blog' or page.layout == 'post' %}aria-current="page"{% endif %}>Blog</a>
        <a href="https://github.com/inventor7777">GitHub ↗</a>
        <button id="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">◐</button>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
  </div>
</body>
</html>
